    nivel_esperado: "Ficha 5.1: Conectable. Ficha 5.2: Depurado y documentado. Ficha 5.3: Identificado o documentado."
    responsable_dato:
      unidad: "Dirección de Educación y Desarrollo Humano (DEDH), punto focal"
      sigla: DEDH
      codeowner: "@RESPONSABLE-D5"
    fuente: "Convocatoria (fichas y niveles); Anexo 2 §5 y §6 (alcance y responsable)"

rubrica:
  fuente: "Convocatoria, Cómo valoramos (coincide con el Anexo 2 §7.3)"
  criterios:
    - {id: calidad, nombre: "Calidad y consistencia del activo de datos", peso: 20}
    - {id: documentacion, nombre: "Documentación y trazabilidad", peso: 20}
    - {id: reproducibilidad, nombre: "Reproducibilidad", peso: 15}
    - {id: cobertura, nombre: "Cobertura del desafío / KPI", peso: 15}
    - {id: territorializacion, nombre: "Territorialización e interoperabilidad", peso: 10}
    - {id: gobernanza, nombre: "Gobernanza y uso responsable", peso: 10}
    - {id: utilidad, nombre: "Utilidad para decisiones y reutilización", peso: 10}

contacto:
  buzon_institucional: "alberto.saavedra@lapaz.bo"   # decisión de la persona usuaria, 26/10/2026
  incidencias: true
  nota: "Después de la clínica de datos, las consultas se atienden por escrito."

visibilidad:
  regla_general: "Todo repositorio nace privado. Solo pasa a público con aprobación explícita, repositorio por repositorio."
  repositorios:
    - {repositorio: plantilla, visibilidad_inicial: privado, visibilidad_prevista: público, condicion: "Aprobación explícita tras la revisión de calidad y privacidad."}
    - {repositorio: equipo_plantilla, visibilidad_inicial: privado, visibilidad_prevista: público, condicion: "Aprobación explícita tras la revisión de calidad y privacidad."}
    - {repositorio: edicion, visibilidad_inicial: privado, visibilidad_prevista: público, condicion: "Aprobación explícita; sin datos internos ni datos personales."}
    - {repositorio: paquetes_internos, visibilidad_inicial: privado, visibilidad_prevista: privado, condicion: "Nunca se hace público."}
  datos_internos:
    - "Los datos internos en su forma original solo se guardan en el repositorio de paquetes internos."
    - "Un dato interno solo sale de allí mediante la compuerta de liberación (docs/compuerta-de-liberacion.md)."
    - "BD EDU DAT: el xlsx original nunca se publica. Con autorización de la DEDH, puede publicarse un derivado agregado a nivel de unidad educativa: generado por script desde el original, en formato abierto, sin metadatos de autor y sin posibles datos personales."
