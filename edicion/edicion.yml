    nivel_esperado: "Identificado → Documentado → Conectable, con énfasis en series históricas y georreferenciación."
    responsable_dato:
      unidad: "Otras secretarías municipales, empresas de servicios y entidades nacionales (participación planificada para 2027)"
      sigla: null
      codeowner: "@RESPONSABLE-D4"
    fuente: "Convocatoria; Anexo 2 §5 (tipo SUSTAINABLE y alcance)"
  - id: D5
    slug: educacion-urbana
    titulo: "Educación urbana para una ciudad que aprende"
    tipo_indicadores: null
