    nivel_esperado: "Identificado o documentado, priorizando consistencia y capacidad de actualización."
    responsable_dato:
      unidad: "Otras secretarías municipales y entidades nacionales (participación planificada para 2027)"
      sigla: null
      codeowner: "@RESPONSABLE-D3"
    fuente: "Convocatoria; Anexo 2 §5"
  - id: D4
    slug: sostenibilidad-resiliencia
    titulo: "Sostenibilidad para una ciudad que respira, se mueve y resiste"
    tipo_indicadores: SOSTENIBLE
    n_indicadores: 39
