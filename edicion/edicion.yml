# edicion.yml — Datatón Urbano Punto Cero (La Paz, 2026)
#
# Este es el único archivo donde se escriben nombres, fechas, sede, desafíos,
# pesos de la rúbrica, responsables, contacto y reglas de visibilidad.
# Los demás archivos toman esos datos de aquí con:
#
#     python -m dataton regenerar
#
# Fuentes: la convocatoria manda. El Anexo 2 (plan por resultados) completa lo
# que la convocatoria no dice, sin contradecirla. Ver contexto/extraidos/DIFERENCIAS.md
# en el espacio de construcción.

version_esquema: 1

edicion:
  id: dataton-lapaz-2026-punto-cero
  nombre: "Datatón Urbano Punto Cero"
  programa: "La Paz data-first: Primero los datos paceños"
  numero: 1
  anio: 2026
  descripcion: >-
    Primera edición piloto del programa «La Paz data-first: Primero los datos paceños»
    del Gobierno Autónomo Municipal de La Paz (GAMLP), en la Semana de La Paz Inteligente.
    Es un datatón de preparación de datos: no se construyen aplicaciones. Se busca el activo
    de datos más confiable, comprensible, trazable y reutilizable. No hay premio monetario:
    los equipos reciben reconocimiento público y sus aportes validados pueden incorporarse al
    Portafolio Paceño de Preparación de Datos Urbanos, con mención de su autoría.
  ciudad: "La Paz"
  pais: "Bolivia"
  institucion:
    nombre: "Gobierno Autónomo Municipal de La Paz"
    sigla: GAMLP
  organizadores:
    - {nombre: "Secretaría Municipal de Ciudad Inteligente", sigla: SMCI, rol: "Organiza"}
    - {nombre: "Dirección de Innovación y Ciudad Inteligente", sigla: DICI, rol: "Organiza y aprueba"}
    - {nombre: "Unidad de Ciudad Inteligente y Laboratorios Urbanos", sigla: UCILU, rol: "Ejecuta"}
    - {nombre: "Unidad de Innovación y Transformación Digital", sigla: UITD, rol: "Ejecuta"}
  roles:   # fuente: Anexo 2 §1 y §6; CLAUDE.md (deslinde)
    - {rol: "Ejecución del datatón", quien: "UCILU y UITD, con aprobación de la DICI"}
    - {rol: "Convocatoria, apertura, comunidad y presentación", quien: "Unidad de Ciudad Inteligente y Laboratorios Urbanos (UCILU)"}
    - {rol: "Paquetes de datos, entorno de trabajo y medición antes y después", quien: "Unidad de Innovación y Transformación Digital (UITD)"}
    - {rol: "Responsabilidad sobre los datos", quien: "Cada secretaría es responsable de sus datos (ver la tabla de responsables por desafío)"}
    - {rol: "Revisión de las fichas de indicadores antes de cualquier uso oficial", quien: "Unidad de Investigación, Información y Estadística Municipal (UIIEM)"}
    - {rol: "Reglas y privacidad", quien: "Dirección de Asuntos Jurídicos (DAJ), con la UITD"}
    - {rol: "Revisión técnica, privacidad y entorno seguro", quien: "Dirección de Tecnologías (DT)"}
  version_repositorio: "0.1.0"
  fuentes:
    - {documento: "Convocatoria al Dataton Punto Cero (PDF)", sha256: "947b8a70323b712a5eec2bef79cdd45415f99ccfcf150c5049eabd70b2c0c137", prioridad: 1}
    - {documento: "Anexo 2: Plan por resultados del dataton punto cero (versión inicial para gabinete, 19/10/2026)", sha256: "af7fa6d7dc2145019e3156ffff84559290ceea1e2d7ceea813845efaec1e42b7", prioridad: 2}

github:
  organizacion: Primero-Los-Datos-de-La-Paz
  repositorios:
    plantilla: dataton-urbano-plantilla
    equipo_plantilla: dataton-equipo-plantilla
    edicion: dataton-lapaz-2026-punto-cero
    paquetes_internos: dataton-lapaz-2026-paquetes-internos

sede:
  nombre: "Casa de la Cultura"
  direccion: null
  fuente: "Anexo 2 (nota inicial y §8); la convocatoria no indica sede"

