    nivel_esperado: "Documentado → Listo para tablero → Listo para verificar, según el indicador."
    responsable_dato:
      unidad: "SMCI, por medio de la DICI y la UITD, con la UIIEM"
      sigla: SMCI
      codeowner: "@RESPONSABLE-D1"
    fuente: "Convocatoria (pregunta, indicadores, nivel); Anexo 2 §5 (alcance y responsable)"
  - id: D2
