  - id: inscripciones
    fecha_inicio: 2026-10-19
    fecha_fin: null
    actividad: "Inicio de inscripciones."
    fuente: "Convocatoria, Cronograma"
  - id: apertura
    fecha_inicio: 2026-10-26
    fecha_fin: null
    actividad: "Inicio del datatón: apertura, orientación sobre datos, presentación de desafíos y formación de equipos."
    fuente: "Convocatoria, Cronograma y Qué recibirás"
  - id: trabajo
    fecha_inicio: 2026-10-26
    fecha_fin: 2026-10-29
    actividad: "Trabajo de equipos, preparación de datos y mentorías."
    fuente: "Convocatoria, Cronograma"
  - id: clinica
    fecha_inicio: 2026-10-28
    fecha_fin: null
    actividad: "Única clínica de datos con mentores: calidad, documentación, información geográfica y privacidad."
    fuente: "Convocatoria, Qué recibirás"
  - id: presentacion
    fecha_inicio: 2026-10-30
    fecha_fin: null
