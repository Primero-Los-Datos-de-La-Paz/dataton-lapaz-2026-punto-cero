name: Pregunta sobre un paquete
description: Dudas sobre el contenido, el formato o las reglas de un paquete de datos.
title: "[Pregunta] "
labels: ["pregunta"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de preguntar, revisa el README, el diccionario y la procedencia del paquete.
        **No pegues datos personales** en esta incidencia.
  - type: dropdown
    id: desafio
    attributes:
      label: Desafío
      options:
        # dataton:opciones-desafios
        - "D1 · La base digital de una ciudad que funciona"
        - "D2 · Servicios urbanos inteligentes para una ciudad que aprende"
        - "D3 · La estructura profunda de una ciudad de oportunidades y bienestar"
        - "D4 · Sostenibilidad para una ciudad que respira, se mueve y resiste"
        - "D5 · Educación urbana para una ciudad que aprende"
        - "No sé / varios desafíos"
        # /dataton
    validations:
      required: true
  - type: input
    id: paquete
    attributes:
      label: Paquete o archivo
      description: Ruta dentro del repositorio, por ejemplo paquetes/D1-…/data/raw/archivo.csv
    validations:
      required: true
  - type: textarea
    id: pregunta
    attributes:
      label: Tu pregunta
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Qué intentaste o dónde lo buscaste
